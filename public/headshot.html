<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="The Selfie Tool — a StuntListing add-on. One photo with your name, height, weight and contact details printed underneath.">
<title>Headshot · The Selfie Tool</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d0e11'/%3E%3Cpath d='M32 12c8.3 0 14 6.6 14 15.4 0 9.6-6 17-14 17s-14-7.4-14-17C18 18.6 23.7 12 32 12z' fill='none' stroke='%23ff5a36' stroke-width='3.5' stroke-dasharray='4 5' stroke-linecap='round'/%3E%3Cpath d='M24 44c-6 1.6-11 5-13 12M40 44c6 1.6 11 5 13 12' fill='none' stroke='%23ff5a36' stroke-width='3.5' stroke-dasharray='4 5' stroke-linecap='round'/%3E%3C/svg%3E">
<!-- How the link looks when it is texted or posted. These have to be
     absolute URLs — a scraper has no page to resolve a relative one
     against — so the origin is written out. If this app ever moves to a
     StuntListing domain, these are the lines to change. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="StuntListing">
<meta property="og:title" content="Headshot · The Selfie Tool">
<meta property="og:description" content="One photo with your name, height, weight and contact details printed underneath.">
<meta property="og:url" content="https://hairselfie.jamie-181.workers.dev/headshot.html">
<meta property="og:image" content="https://hairselfie.jamie-181.workers.dev/preview.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Four dashed head outlines beside the words The Selfie Tool">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Headshot · The Selfie Tool">
<meta name="twitter:description" content="One photo with your name, height, weight and contact details printed underneath.">
<meta name="twitter:image" content="https://hairselfie.jamie-181.workers.dev/preview.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-layout="headshot">

<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="14" fill="#101218"/>
      <path d="M32 12c8.3 0 14 6.6 14 15.4 0 9.6-6 17-14 17s-14-7.4-14-17C18 18.6 23.7 12 32 12z" fill="none" stroke="#ff5a36" stroke-width="3.5" stroke-dasharray="4 5" stroke-linecap="round"/>
      <path d="M24 44c-6 1.6-11 5-13 12M40 44c6 1.6 11 5 13 12" fill="none" stroke="#ff5a36" stroke-width="3.5" stroke-dasharray="4 5" stroke-linecap="round"/>
    </svg>
    <div>
      <h1>The Selfie Tool</h1>
      <p class="tagline">a StuntListing add-on</p>
    </div>
  </div>
  <div id="session-chip" class="session-chip" aria-live="polite"></div>
</header>

<nav class="tabs" aria-label="Which kind of selfie">
  <a class="tab" href="index.html">Hair</a>
  <a class="tab" href="wardrobe.html">Wardrobe</a>
  <a class="tab" href="headshot.html" aria-current="page">Headshot</a>
</nav>

<!-- shown when the page was opened from a coordinator's request link -->
<div id="request-banner" class="request-banner" hidden></div>

<main>
  <!-- ── Photo ─────────────────────────────────────────────────── -->
  <section class="panel" id="photos-panel">
    <div class="panel-head">
      <span class="step-num" aria-hidden="true">1</span>
      <h2>Your headshot</h2>
    </div>
    <p class="hint">Camera at eye level, head filling the dashed guide.</p>

    <div class="photo-actions">
      <button id="add-photos" class="btn btn-primary" type="button">
        <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
        Add photo
      </button>
      <button id="take-photos" class="btn" type="button">
        <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1.2-2h7.2l1.2 2h1.7A2.5 2.5 0 0 1 21 8.5v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5v-9Z" stroke="currentColor" stroke-width="1.9" fill="none"/><circle cx="12" cy="13" r="3.6" stroke="currentColor" stroke-width="1.9" fill="none"/></svg>
        Take photo
      </button>
    </div>

    <div id="grid" class="grid single" aria-label="Photo position"></div>
  </section>

  <!-- ── Details ────────────────────────────────────────────────── -->
  <section class="panel" id="info-panel">
    <div class="panel-head">
      <span class="step-num" aria-hidden="true">2</span>
      <h2>Details</h2>
      <button class="btn btn-small head-action" id="edit-details" type="button">Edit</button>
    </div>

    <div class="summary" id="details-summary">
      <div class="summary-text" id="summary-text"></div>
    </div>

    <form id="info-form" class="info-form" autocomplete="off" hidden>
      <div class="field field-wide">
        <label for="f-name">Name</label>
        <input id="f-name" name="name" type="text" placeholder="Performer name" autocomplete="name">
      </div>
      <div class="field">
        <label for="f-height">Height</label>
        <input id="f-height" name="height" type="text" placeholder="e.g. 5&#8242;11&#8243;">
      </div>
      <div class="field">
        <label for="f-weight">Weight</label>
        <input id="f-weight" name="weight" type="text" placeholder="e.g. 175">
      </div>
      <div class="field">
        <label for="f-phone">Phone</label>
        <input id="f-phone" name="phone" type="tel" placeholder="(555) 555-0100">
      </div>
      <div class="field">
        <label for="f-email">Email</label>
        <input id="f-email" name="email" type="email" placeholder="you@example.com">
      </div>
    </form>

    <div class="compact-row">
      <input id="f-note" type="text" maxlength="140" placeholder="Add a note (optional)">
      <span class="char-count" id="note-count"></span>
    </div>

    <div class="checks">
      <label class="check"><input type="checkbox" id="f-cut"> Able to cut hair</label>
      <label class="check"><input type="checkbox" id="f-shave"> Able to shave</label>
    </div>
  </section>

  <!-- ── Create ────────────────────────────────────────────────── -->
  <section class="panel" id="create-panel">
    <div class="panel-head">
      <span class="step-num" aria-hidden="true">3</span>
      <h2>Create</h2>
    </div>
    <p id="create-status" class="hint" aria-live="polite"></p>
    <button id="create-btn" class="btn btn-primary btn-big" type="button">Create my headshot</button>

    <div id="result" class="result" hidden>
      <img id="result-img" alt="Finished headshot: one photo with performer details below">
      <button id="save-image" class="btn btn-primary btn-big" type="button">
        <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M4 16.5V18a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-1.5M12 15V4m0 0L7.5 8.5M12 4l4.5 4.5" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        Save image
      </button>
      <a id="download-link" download hidden>download</a>
      <p class="hint hint-small" id="save-hint"></p>
      <p class="hint hint-small" id="saved-line" aria-live="polite" hidden></p>
    </div>
  </section>
</main>

<!-- ── Adjust modal ────────────────────────────────────────────── -->
<div id="adjust-modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="adjust-title">
  <div class="modal-card">
    <h3 id="adjust-title">Adjust photo</h3>
    <p class="hint hint-small">Drag to reposition · pinch or scroll to zoom.</p>
    <div class="adjust-stage">
      <canvas id="adjust-canvas"></canvas>
      <div id="adjust-guide" class="adjust-guide" aria-hidden="true"></div>
    </div>
    <label class="zoom-row">
      <span>Zoom</span>
      <input type="range" id="adjust-zoom" min="100" max="400" value="100" step="1">
    </label>
    <div class="modal-actions">
      <button id="adjust-rotate" class="btn btn-small" type="button" title="Rotate 90°">⟳ Rotate</button>
      <button id="adjust-reset" class="btn btn-small" type="button">Reset</button>
      <span class="spacer"></span>
      <button id="adjust-cancel" class="btn btn-small" type="button">Cancel</button>
      <button id="adjust-done" class="btn btn-primary btn-small" type="button">Done</button>
    </div>
  </div>
</div>

<noscript><p style="padding:16px;color:#fff">The selfie tool needs JavaScript turned on.</p></noscript>

<script src="js/config.js"></script>
<script src="js/graphql.js"></script>
<script src="js/outlines.js"></script>
<script src="js/resolve.js"></script>
<script src="js/format.js"></script>
<script src="js/api.js"></script>
<script src="js/signin.js"></script>
<script src="js/sheets.js"></script>
<script src="js/detect.js"></script>
<script src="js/composer.js"></script>
<script src="js/tripod.js"></script>
<script src="js/app.js"></script>
</body>
</html>
