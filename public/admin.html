<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="14" fill="#101218"/>
      <path d="M32 12c8.3 0 14 6.6 14 15.4 0 9.6-6 17-14 17s-14-7.4-14-17C18 18.6 23.7 12 32 12z" fill="none" stroke="#ff5a36" stroke-width="3.5" stroke-dasharray="4 5" stroke-linecap="round"/>

    <div>

  </div>
  <div id="session-chip" class="session-chip" aria-live="polite"></div>

<nav class="tabs" aria-label="Which kind of selfie">

  <a class="tab" href="wardrobe.html">Wardrobe</a>

<main>
  <section class="panel">
    <div class="panel-head"><h2>How it is being used</h2></div>
    <div id="admin-status" class="hint" aria-live="polite">Loading…</div>
    <div id="admin-figures" class="figures" hidden></div>
  </section>

  <section class="panel" id="admin-people-panel" hidden>
    <div class="panel-head"><h2>People</h2></div>
    <p class="hint">Everyone who has signed in or saved something, most recent first.</p>
    <div class="table-scroll"><table class="admin-table" id="admin-people"></table></div>
  </section>

  <section class="panel" id="admin-recent-panel" hidden>
    <div class="panel-head"><h2>Latest sheets</h2></div>
    <div class="table-scroll"><table class="admin-table" id="admin-recent"></table></div>
  </section>
</main>
